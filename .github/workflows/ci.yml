name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run core fast test suite
        run: |
          pytest tests/test_compat.py tests/test_models.py tests/test_validator.py tests/test_cryptographic_validator.py
          pytest tests/test_pii_security.py tests/test_quality.py tests/test_exporters.py tests/test_export_pipeline.py
          pytest tests/test_ui_contracts.py tests/test_server_api.py tests/test_single_instance.py tests/test_desktop.py tests/test_desktop_stability.py
          pytest tests/test_audio_extractor.py tests/test_audio_editor.py tests/test_pipeline.py tests/test_agent_swarm.py tests/test_council.py
