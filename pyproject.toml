[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scriber"
version = "2.0.0"
description = "High-Precision Video Intelligence, Whisper Flow Transcription, Acoustic Diarization, and Voice Synthesis Desktop Studio."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Lakshya Prasher" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.24.0",
    "av>=11.0.0,<=18.1.0",
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.0.0",
    "onnxruntime>=1.16.0",
    "edge-tts>=6.1.0",
    "boto3>=1.28.0",
    "miniaudio>=1.59",
    "pillow>=10.0.0",
    "pywebview>=5.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
scriber = "scriber.cli:main"

[project.gui-scripts]
scriber-desktop = "scriber.desktop:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scriber*"]

[tool.setuptools.package-data]
scriber = [
    "assets/*",
    "web/static/*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
